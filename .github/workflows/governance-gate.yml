name: Governance Gate

on:
  pull_request:
  # An approval submitted, edited or dismissed changes the verdict, and no
  # other event fires when it happens: without this the job that checks
  # approvals simply never reruns.
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: governance-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Skipped on review events: nothing in the tree changed, only the approvals.
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gate 2 diffs the change set against the merge-base, so the gate is
          # only as good as the history available to it. A shallow clone would
          # silently leave it with nothing to compare.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
        working-directory: vscode-extension

      - name: Resolve diff base
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF:-}" ]]; then
            # The merge-base, not the base branch tip: changes that landed on the
            # base branch after this one forked are not this change's scope.
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            # push or manual run: compare against the commit before this one
            base="$(git rev-parse 'HEAD^' 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run gates and render report
        id: report
        env:
          GOVERNANCE_DIFF_BASE: ${{ steps.base.outputs.base }}
          # Outside the checkout. Redirecting into the workspace would create an
          # untracked file before the gates run, and they would correctly report
          # it as out of scope and as REALITY drift - the harness failing the
          # very check it exists to run.
          REPORT: ${{ runner.temp }}/governance-report.md
        run: |
          set +e
          bash ./scripts/gate_report.sh > "$REPORT"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        # A pull_request run from a fork gets a read-only token, so commenting
        # fails there through no fault of the change. The job summary above is
        # always written, and the verdict step below still fails the run.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.report.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const marker = '<!-- governance-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            // Update in place so a busy pull request does not collect one
            // comment per push.
            const mine = existing.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Verdict
        run: |
          if [[ "${{ steps.report.outputs.rc }}" != "0" ]]; then
            echo "::error::Governance gate failed. See the job summary or the pull request comment."
            exit 1
          fi
          echo "Governance gate passed."

  # Deliberately separate from `gate`, and deliberately minimal. `gate` runs the
  # project's own `make test`, which is code from the branch under review; a
  # recipe there can write any file the job can reach, including the approver
  # list. This job installs nothing, builds nothing and runs no project target,
  # so no code from the pull request executes before the verdict is computed.
  #
  # It is still not a barrier against a hostile author: on a `pull_request`
  # event the workflow and the verifier both come from the branch under review.
  # Making approval mandatory is GitHub's job - see GATE.md.
  approval:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the head under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          echo "base=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect reviewers who approved THIS head
        uses: actions/github-script@v7
        env:
          APPROVERS_FILE: ${{ runner.temp }}/governance-approvers.txt
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const head = process.env.HEAD_SHA;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: number, per_page: 100 }
            );
            // An approval is of a commit, not of a pull request. Accepting an
            // approval of an earlier commit would let an author add a decision
            // after the reviewer looked, and have it count.
            const latest = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) continue;
              latest.set(r.user.login, r);
            }
            const approvers = [...latest.values()]
              .filter((r) => r.state === 'APPROVED' && r.commit_id === head)
              .map((r) => r.user.login);
            fs.writeFileSync(process.env.APPROVERS_FILE, approvers.join('\n') + '\n');
            core.info(`head ${head}`);
            core.info(`approving reviews of this head: ${approvers.join(', ') || '(none)'}`);

      - name: Verify recorded approvals
        env:
          GOVERNANCE_DIFF_BASE: ${{ steps.base.outputs.base }}
          GOVERNANCE_APPROVERS_FILE: ${{ runner.temp }}/governance-approvers.txt
        run: bash ./scripts/verify_approval.sh
