name: Governance Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: governance-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gate 2 diffs the change set against the merge-base, so the gate is
          # only as good as the history available to it. A shallow clone would
          # silently leave it with nothing to compare.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
        working-directory: vscode-extension

      - name: Resolve diff base
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF:-}" ]]; then
            # The merge-base, not the base branch tip: changes that landed on the
            # base branch after this one forked are not this change's scope.
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            # push or manual run: compare against the commit before this one
            base="$(git rev-parse 'HEAD^' 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Diffing against $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Collect approving reviewers
        id: approvers
        if: github.event_name == 'pull_request'
        # No continue-on-error: if the query fails the job fails. A verifier
        # whose input could not be established must never fall through to a
        # pass, and an unwritten file is exactly how it says so.
        uses: actions/github-script@v7
        env:
          APPROVERS_FILE: ${{ runner.temp }}/governance-approvers.txt
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: context.issue.number, per_page: 100 }
            );
            // Latest state per reviewer: an approval that was later dismissed
            // or changed to REQUEST_CHANGES is not an approval.
            const latest = new Map();
            for (const r of reviews) {
              if (!r.user || !['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) {
                continue;
              }
              latest.set(r.user.login, r.state);
            }
            const approvers = [...latest.entries()]
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);
            fs.writeFileSync(process.env.APPROVERS_FILE, approvers.join('\n') + '\n');
            core.info(`approving reviewers: ${approvers.join(', ') || '(none)'}`);

      - name: Run gates and render report
        id: report
        env:
          GOVERNANCE_DIFF_BASE: ${{ steps.base.outputs.base }}
          # Empty on a push, where there is no pull request to have approvals.
          GOVERNANCE_APPROVERS_FILE: ${{ github.event_name == 'pull_request' && format('{0}/governance-approvers.txt', runner.temp) || '' }}
          # Outside the checkout. Redirecting into the workspace would create an
          # untracked file before the gates run, and they would correctly report
          # it as out of scope and as REALITY drift - the harness failing the
          # very check it exists to run.
          REPORT: ${{ runner.temp }}/governance-report.md
        run: |
          set +e
          bash ./scripts/gate_report.sh > "$REPORT"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        # A pull_request run from a fork gets a read-only token, so commenting
        # fails there through no fault of the change. The job summary above is
        # always written, and the verdict step below still fails the run.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.report.outputs.report }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const marker = '<!-- governance-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            // Update in place so a busy pull request does not collect one
            // comment per push.
            const mine = existing.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Verdict
        run: |
          if [[ "${{ steps.report.outputs.rc }}" != "0" ]]; then
            echo "::error::Governance gate failed. See the job summary or the pull request comment."
            exit 1
          fi
          echo "Governance gate passed."
